[package]
name = "matching-engine-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"

strum = { version = "0.26", features = ["derive"] }
uuid = { version = "1.27.0", features = ["v4"] }

redis = { version = "1.0.4", features = ["tls-native-tls", "json"] }
dotenvy = "0.15.7"
rustls = "0.23.45"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


reqwest = { version = "0.12", features = ["blocking"] }
